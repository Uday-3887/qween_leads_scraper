# ITCYBER Full Stack Docker Compose
# Deploys both frontend and backend together

version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itcyber-backend
    ports:
      - "8766:8766"
    environment:
      - ITCYBER_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_output:/app/output
      - backend_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Nginx serving static files)
  frontend:
    image: nginx:alpine
    container_name: itcyber-frontend
    ports:
      - "5173:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_output:
  backend_logs:
